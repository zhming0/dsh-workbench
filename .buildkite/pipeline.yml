# Default queue; the Kubernetes end-to-end step below overrides it.
agents:
  queue: hosted-amd64-small

steps:
  # Hosted agents are single-use; reusable state goes through .buildkite/cache.yml.
  # Every step installs its toolchain from mise.toml, so the image only has to
  # supply git, curl, and a C compiler, the last of which `go test -race` needs.
  # Pinning a language image here would put a second version of Go or Node next
  # to the one mise.toml already pins.
  - label: ":typescript: Provider"
    image: &toolchain buildpack-deps:trixie@sha256:fc37e60062783dc2c137f05d7b22cca1b20a642ecf1881f778b2ce7211038347
    command: .buildkite/steps/test-provider

  - label: ":golang: Runner"
    image: *toolchain
    command: .buildkite/steps/test-runner

  - label: ":protobuf: Generated code is current"
    image: *toolchain
    command: .buildkite/steps/check-codegen

  - label: ":docker: Runner image & smoke test"
    command: .buildkite/steps/smoke-test

  - label: ":docker: Host image"
    command: .buildkite/steps/check-host-image

  - label: ":kubernetes: Agent Sandbox end-to-end"
    agents:
      queue: hosted-amd64-large
    command: .buildkite/steps/kas-smoke-test
    timeout_in_minutes: 30

  - block: ":rocket: Release"
    if: build.branch == "main"
    prompt: "Publish the host and runner images?"

  - label: ":pipeline: Upload release pipeline"
    if: build.branch == "main"
    command: buildkite-agent pipeline upload .buildkite/pipeline.release.yml

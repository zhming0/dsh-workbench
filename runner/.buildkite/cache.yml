# The runner's Go module and build caches, keyed on its go.mod and go.sum.
# Lives in runner/ because cache paths resolve against the working directory.
caches:
  - name: go
    cache_key:
      - "v1"
      - agent: "os"
      - agent: "arch"
        fallback_limit: true
      - checksum: "go.mod"
      - checksum: "go.sum"
    target_paths:
      - "~/go/pkg/mod"
      - "~/.cache/go-build"

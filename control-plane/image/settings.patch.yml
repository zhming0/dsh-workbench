# Your dsh-yawn settings. The image seeds this file once and never
# overwrites it.
#
# No sandbox profile is seeded on purpose: the control plane boots and serves the Web UI
# without one, and the profiles you add name the pool your runner setup
# publishes.
# An id-targeted patch replaces the named row's whole config, so restate every
# field you keep. All settings and their defaults:
# https://github.com/zhming0/dsh-yawn/blob/main/control-plane/README.md#settings
- id: sandbox-manager
  config:
    profiles: {}

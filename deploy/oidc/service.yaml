# Routes to the oauth2-proxy sidecar. dsh itself binds pod loopback, so the
# proxy port is the only one a Service can reach.
apiVersion: v1
kind: Service
metadata:
  name: dsh-host
  namespace: dsh-sandbox
spec:
  selector:
    app.kubernetes.io/name: dsh-host
  ports:
    - name: http
      port: 80
      targetPort: 4180

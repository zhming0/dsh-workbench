# Exposes the dsh host behind OIDC authentication. Copy this overlay, replace
# dsh.example.com in deployment-oauth2-proxy.yaml and ingress.yaml with your
# hostname, and create the secret it expects (see deployment-oauth2-proxy.yaml)
# before applying:
#
#   kubectl apply -k deploy/oidc
#
# This lives beside deploy/kubernetes rather than inside it because kustomize
# refuses a base directory that contains its overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
  - service.yaml
  - ingress.yaml
patches:
  - path: deployment-oauth2-proxy.yaml

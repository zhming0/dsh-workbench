# Example Ingress, written for ingress-nginx. Replace dsh.example.com and the
# TLS secret; adapt the annotations for another controller. dsh's browser
# transport holds WebSockets open at /api/events.* and can carry large RPC
# bodies (attachments), so the defaults for read timeout and body size are
# both too small.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsh-host
  namespace: dsh-sandbox
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-body-size: 300m
spec:
  ingressClassName: nginx
  rules:
    - host: dsh.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsh-host
                port:
                  name: http
  tls:
    - hosts: [dsh.example.com]
      secretName: dsh-host-tls

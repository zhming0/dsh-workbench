apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-runner-public-key.yaml
  - 20-sandbox-template.yaml
  - 30-warm-pool.yaml
  - 40-provider-rbac.yaml
  - 50-host.yaml
# host-oidc.yaml needs a hostname and a Secret filled in first; see its
# comments. The raw manifests above work without it (port-forward access),
# which is what scripts/kas/dev-cluster.sh applies.
patches:
  - path: host-oidc.yaml

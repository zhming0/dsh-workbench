apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: dsh-universal
  namespace: dsh-sandbox
spec:
  # Runners dial the host tunnel, so a per-sandbox Service is unnecessary and
  # no ingress is allowed at all.
  service: false
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  networkPolicyManagement: Managed
  networkPolicy:
    ingress: []
    egress:
      # The runner-initiated tunnel to the host; all RPCs flow over it.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: dsh-sandbox
            podSelector:
              matchLabels:
                app.kubernetes.io/name: dsh-host
        ports:
          - protocol: TCP
            port: 8081
      # DNS is the only cluster service this reference policy explicitly permits.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      # HTTPS is needed for source/package downloads. This also permits private
      # and cluster IPs on 443; replace it with organization CIDRs/FQDN-aware
      # CNI policy in production. All other egress is denied.
      - ports:
          - protocol: TCP
            port: 443
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
  podTemplate:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: DSH_RUNNER_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            # agent-sandbox v0.5.4 normally names the backing pod after its
            # Sandbox. The provider expects this same assigned Sandbox name
            # in the tunnel handshake and in Health responses.
            - name: SANDBOX_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST_URL
              value: tcp://dsh-host-tunnel.dsh-sandbox.svc.cluster.local:8081
            # Create this Secret before the warm pool:
            #   kubectl -n dsh-sandbox create secret generic \
            #     dsh-registration-token --from-literal=token=$(openssl rand -hex 32)
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dsh-registration-token
                  key: token
          ports:
            # The plain health listener; only the kubelet probe uses it.
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace

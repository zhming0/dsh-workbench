# The sandbox pool mounts this ConfigMap. HOST_URL names the tunnel Service
# below; both names are fixed because the pool's SandboxTemplate reads them,
# and that manifest is shared by kustomize installs and this chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsh-runner-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-workbench.labels" . | nindent 4 }}
data:
  HOST_URL: {{ include "dsh-workbench.tunnelUrl" . | quote }}

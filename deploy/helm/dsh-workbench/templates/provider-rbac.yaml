# The identity the host uses for the Kubernetes backend's API calls, and the
# permissions it needs to operate sandboxes. The host is the client, so these
# ship with the host rather than with the sandbox pool manifests. Non-Kubernetes
# backends leave the identity and its permissions unused.
{{- include "dsh-workbench.validate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsh-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-workbench.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dsh-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-workbench.labels" . | nindent 4 }}
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dsh-provider
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-workbench.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: dsh-provider
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dsh-provider

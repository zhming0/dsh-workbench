{{- include "dsh-workbench.validate" . }}
{{- if not .Values.registrationToken.existingSecret }}
{{- /* Fixed name: the pool's SandboxTemplate reads it, and that
manifest is shared with kustomize installs. */}}
{{- $name := "dsh-registration-token" }}
{{- $token := .Values.registrationToken.value }}
{{- if not $token }}
{{- /* Reuse the token an earlier upgrade of this release generated so a
`helm upgrade` never rotates it out from under the warm pods. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-workbench.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}

{{- include "dsh-yawn.validate" . }}
{{- if .Values.controlPlane.sandboxManager }}
{{- /* The chart-owned settings layer. dsh applies this home-level file after
the seeded profile file, and the id-targeted row replaces that row's whole
config, so these values win for sandbox-manager while everything else in the
seeded file stays the user's. Read-only in the container on purpose: values
are its only writer. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dsh-yawn.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-yawn.labels" . | nindent 4 }}
data:
  cordis.patch.yml: |
{{ include "dsh-yawn.settingsPatch" . | indent 4 }}
{{- end }}

apiVersion: v2
name: dsh-yawn
description: >-
  The dsh-yawn control plane: one dsh host, its data volume, the tunnel
  Service runners dial, and the shared registration token. The sandbox
  infrastructure is a separate kustomize base (deploy/kubernetes/runner).
type: application
# Stamped with the release version by .buildkite/steps/package-and-release.
# appVersion is the default control-plane image tag and the ref the NOTES point the
# sandbox pool at, so the two move together.
